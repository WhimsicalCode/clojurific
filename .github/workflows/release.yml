name: Release

# Releases Clojurific when a GitHub release is published:
#
#   gh release create v0.12.2 --repo WhimsicalCode/clojurific --target main --notes-file notes.md
#
# The release's commit must be on main, its tag must match
# src/main/js/package.json's version, and CHANGELOG.md must date it. After the
# tests:
# - npm: stages the packages clojurific and create-clojurific (npm create
#   clojurific, of the same version) with trusted publishing (GitHub's OIDC
#   token, configured in each package's settings on npmjs.com for this
#   workflow) and provenance, no npm token. A maintainer approves the staged
#   versions with 2FA (npm stage approve <id>, or on npmjs.com) to publish them.
# - Clojars: deploys com.whimsical/clojurific in the release environment, whose
#   required reviewer approves the deployment and which holds the
#   CLOJARS_USERNAME and CLOJARS_DEPLOY_TOKEN secrets. Clojars has no staging,
#   the version is public right away.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --quiet --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The release's commit $GITHUB_SHA isn't on main"
            exit 1
          fi
          version=$(node -p "require('./src/main/js/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release's tag $TAG doesn't match package.json's version $version"
            exit 1
          fi
          create_version=$(node -p "require('./src/main/js/create-clojurific/package.json').version")
          if [ "$create_version" != "$version" ]; then
            echo "::error::create-clojurific's version $create_version isn't clojurific's $version"
            exit 1
          fi
          if ! grep -qE "^## $version \[[0-9]{4}-[0-9]{2}-[0-9]{2}\]$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md doesn't date $version (## $version [YYYY-MM-DD])"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    name: test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # Java 17 is the launcher's minimum
          - os: ubuntu-latest
            java: '17'
          - os: ubuntu-latest
            java: '25'
          - os: macos-latest
            java: '25'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.11.1.1155

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-release-${{ hashFiles('deps.edn', 'src/main/js/cljf/resolver.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-m2-release-

      - name: ES module build and runtime tests
        run: script/test-esm

      - name: Launcher and npm package tests
        env:
          CLJF_TEST_DOWNLOADS: '1'
        run: script/test-launcher

      - name: Clojars artifact test
        run: script/test-clojars

  npm:
    # the package gets the compiler from Clojars
    needs: [check, test, clojars]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # npm's trusted publishing and provenance
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.11.1.1155

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          registry-url: 'https://registry.npmjs.org'

      # trusted publishing and npm stage need a current npm, Node.js 22 bundles npm 10
      - name: Install npm
        run: npm install -g npm@11.20.0

      - name: Pack
        run: script/package-npm

      - name: Stage
        run: |
          npm stage publish "./builds/clojurific-$VERSION.tgz" --access public --provenance
          npm stage publish "./builds/create-clojurific-$VERSION.tgz" --access public --provenance

  clojars:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.11.1.1155

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: script/clojars deploy
