<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground · Clojurific</title>
  <meta name="description" content="A React app and a REPL in ClojureScript, compiled in your browser by Clojurific's self-hosted compiler as you type.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap">
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/clojurific/play.cljs"></script>
</head>
<body class="play-page">
  <header class="nav">
    <a class="brand" href="/">
      <img alt="Clojurific" src="/img/clojurific-dark-60.svg" height="28">
    </a>
    <span class="nav-title">Playground</span>
    <a class="code-link" href="https://github.com/WhimsicalCode/clojurific" aria-label="Clojurific on GitHub">
      <img src="/img/github-black.svg" height="20" alt="GitHub">
    </a>
  </header>
  <main class="react-play">
    <section class="pane editor card" aria-label="Code">
      <div class="pane-head">
        <span>app.cljs</span>
        <span id="status" class="status"></span>
        <button id="reset" class="pane-button" type="button" title="Replace the code with the sample">Reset</button>
      </div>
      <div class="editor-body">
        <div class="input-wrap">
          <pre id="code-highlight" class="input-highlight" aria-hidden="true"></pre>
          <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="ClojureScript code of the app"></textarea>
        </div>
      </div>
    </section>
    <section class="pane preview card" aria-label="Preview">
      <div class="pane-head"><span>Preview</span></div>
      <div class="preview-body">
        <pre id="preview-error" class="preview-error" hidden></pre>
        <div id="preview-root" class="preview-root"></div>
      </div>
    </section>
    <section id="repl" class="pane repl card busy" aria-label="REPL">
      <div class="pane-head"><span>REPL</span></div>
      <div id="log" class="log"></div>
      <div class="input-row">
        <label id="prompt" for="input">app&gt;</label>
        <div class="input-wrap">
          <pre id="input-highlight" class="input-highlight" aria-hidden="true"></pre>
          <textarea id="input" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="ClojureScript"></textarea>
        </div>
        <span class="spinner" aria-hidden="true"></span>
      </div>
    </section>
  </main>
</body>
</html>
